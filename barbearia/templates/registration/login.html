{% extends 'base.html' %}

{% block title %}Entrar - Barbearia{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <h1>💈</h1>

                    <h2>Entrar</h2>

                    <p class="text-muted">
                        Acesse o sistema da barbearia
                    </p>

                </div>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-dark w-100"
                    >
                        Entrar
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
