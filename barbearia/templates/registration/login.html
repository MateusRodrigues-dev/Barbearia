{% extends 'base.html' %}

{% block title %}Entrar - Barbearia{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="text-center mb-4">

            <div style="font-size: 55px;">
                💈
            </div>

            <h1 class="fw-bold">
                Barbearia
            </h1>

            <p class="text-muted">
                Acesse sua conta para continuar
            </p>

        </div>


        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h3 class="mb-4 text-center">
                    🔐 Entrar
                </h3>


                {% if form.errors %}

                    <div class="alert alert-danger">
                        Usuário ou senha incorretos.
                    </div>

                {% endif %}


                <form method="post">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label">
                            Usuário
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Digite seu usuário"
                            required
                            autofocus
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Senha
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-dark w-100"
                    >
                        🔐 Entrar
                    </button>

                </form>

            </div>

        </div>


        <div class="text-center mt-3">

            <a
                href="{% url 'home' %}"
                class="text-decoration-none"
            >
                ← Voltar para o início
            </a>

        </div>

    </div>

</div>

{% endblock %}
